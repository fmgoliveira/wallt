# One container, one volume. TLS and the public hostname are handled by the nginx that already
# runs on the host (see docs/deploy.md); the app is only published on 127.0.0.1.
services:
  wallt:
    # Prebuilt image from GHCR. Pin a release with WALLT_VERSION=X.Y.Z in .env (default: latest).
    # To build from source instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/fmgoliveira/wallt:${WALLT_VERSION:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - wallt-data:/data
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_URL: ${APP_URL:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      # One-time guard for creating the first user; remove it after setup.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Encrypted Drive backups (disabled unless all three are set; see docs/deploy.md)
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      # Peers whose X-Real-IP is trusted: host nginx reaches the container from the bridge gateway.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  wallt-data:
