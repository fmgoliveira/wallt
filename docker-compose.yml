# One container, one volume. TLS and the public hostname are handled by the nginx that already
# runs on the host (see docs/deploy.md); the app is only published on 127.0.0.1.
services:
  wallt:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: wallt:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - wallt-data:/data
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_URL: ${APP_URL:-https://wallt.franciscoliveira.com}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Peers whose X-Real-IP is trusted: host nginx reaches the container from the bridge gateway.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  wallt-data:
