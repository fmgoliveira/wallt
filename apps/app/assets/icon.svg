<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Wallt">
  <title>Wallt</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#9aa0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9aa0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4a505d" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#12141a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glassBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7280" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2a2e38" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowA)"/>
  <rect width="1024" height="1024" fill="url(#glowB)"/>

  <g id="hat" transform="translate(0 20)">
    <!-- soft ground shadow -->
    <ellipse cx="512" cy="712" rx="320" ry="24" fill="#0b0a24" opacity="0.28"/>

    <!-- brim: short, snapped up at the sides -->
    <path transform="translate(0 -44)" d="M168 612 Q512 726 856 612 Q890 646 852 676 Q512 780 172 676 Q134 646 168 612 Z"
          fill="url(#glass)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>

    <!-- crown: flat top, slightly tapered -->
    <path d="M268 620 L290 392 Q294 344 344 340 L680 340 Q730 344 734 392 L756 620 Q512 682 268 620 Z"
          fill="url(#glass)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>

    <!-- flat top face with the pork-pie dent -->
    <path d="M298 384 Q512 424 726 384 Q730 352 680 346 L344 346 Q294 352 298 384 Z"
          fill="#8b93a3" opacity="0.55"/>
    <path d="M326 372 Q512 410 698 372" fill="none" stroke="#ffffff" stroke-opacity="0.65"
          stroke-width="5" stroke-linecap="round"/>

    <!-- band -->
    <path d="M276 548 Q512 612 748 548 L754 604 Q512 668 270 604 Z"
          fill="url(#glassBand)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>

    <!-- glass highlight -->
    <path d="M330 420 Q346 400 372 402 L392 560 Q352 548 336 528 Z" fill="#ffffff" opacity="0.22"/>
  </g>
</svg>
