name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds every workspace; the Expo web export joins this once apps/app exists (#3).
      - run: pnpm build

  docker:
    name: server image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Dockerfile
        id: has
        run: |
          if [ -f apps/server/Dockerfile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "::notice::apps/server/Dockerfile not present yet (added in #12); skipping"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.has.outputs.found == 'true'
      - uses: docker/build-push-action@v6
        if: steps.has.outputs.found == 'true'
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: true
          tags: wallt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size
        if: steps.has.outputs.found == 'true'
        run: |
          size=$(docker image inspect wallt:ci --format '{{.Size}}')
          echo "### Image size: $((size / 1024 / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"
          echo "wallt:ci = $((size / 1024 / 1024)) MiB"
      - name: Smoke test (starts with only a /data volume)
        if: steps.has.outputs.found == 'true'
        run: |
          docker run -d --name wallt -p 3000:3000 -e ENCRYPTION_KEY="$(openssl rand -base64 32)" wallt:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && break; sleep 1; done
          curl -fsS localhost:3000/health
          echo "web: $(curl -fsS -o /dev/null -w '%{http_code}' localhost:3000/)"
          docker logs wallt

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
