// Gradle init script: signs the app's release build with the keystore given by environment variables.
// Used by the release workflow (`./gradlew -I .github/android/signing.init.gradle assembleRelease`) so the
// generated android/ project needs no edits and the key only ever exists as an Actions secret.
allprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application')) {
            def path = System.getenv('ANDROID_KEYSTORE_PATH')
            if (!path) throw new GradleException('ANDROID_KEYSTORE_PATH is not set')
            project.android {
                signingConfigs {
                    release {
                        storeFile file(path)
                        storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                        keyAlias System.getenv('ANDROID_KEY_ALIAS')
                        keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                    }
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.release
                    }
                }
            }
        }
    }
}
